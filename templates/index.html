<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>PDF Parser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        .flash {
            padding: 10px;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
        .flash.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input[type="file"] {
            border: 2px dashed #ccc;
            padding: 2rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 1rem;
        }
        input[type="file"]::file-selector-button {
            display: none;
        }
        .file-label {
            color: #888;
        }
        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF Parser</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <p>Upload a PDF file to parse its table of contents and sections.</p>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="pdf_file" id="pdf_file" accept=".pdf">
            <label for="pdf_file" class="file-label">Drag and drop your PDF here or click to browse</label>
            <button type="submit">Parse and Download</button>
        </form>
    </div>
    <script>
        document.getElementById('pdf_file').addEventListener('change', function() {
            const fileName = this.files[0] ? this.files[0].name : "Drag and drop your PDF here or click to browse";
            document.querySelector('.file-label').textContent = fileName;
        });
    </script>
</body>
</html>
